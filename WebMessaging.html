<script>
function handleMySubmit(event) {
    // 1. Prevent the page from reloading immediately
    event.preventDefault();

    // 2. Record the event
    Genesys("command", "Journey.record", {
        eventName: "form_submitted",
        customAttributes: {
            formName: "CarInsuranceForm",
            formId: "insurance_quote_form"
        }
    });

    // 3. Wait 200ms to ensure the packet leaves the browser, then submit manually
    setTimeout(() => {
        event.target.submit(); 
    }, 200);
}
</script>

<script>
function checkAbandonment(input) {
    // 如果用户离开这个框时，框里是空的
    if (input.value === "") {
        Genesys("command", "Journey.record", {
            eventName: "form_abandoned",
            customAttributes: {
                formName: input.name,
                last_field_touched: input.name
            }
        });
    }
}
</script>


<!DOCTYPE html>
<html>
<head><title>Messaging Test</title>
<meta name="keywords" content="home">

<body>
    <h1>Testing Genesys Web Messaging</h1>

  <br><br>

  
  <form id="insurance_quote_form" name="CarInsuranceForm" action="WebMessaging.html" method="POST" onsubmit="return handleMySubmit(event)">

    <label for="car_model">Car Model:</label>
    <input type="text" id="car_model" name="car_model" required onblur="checkAbandonment(this)">

    <script>
        // 触发购物车事件
        function triggerAddToCart() {
            console.log("正在发送 product_added 事件...");
            Genesys("command", "Journey.record", {
                eventName: "product_added",
                customAttributes: {
                    product_id: "CAL-AI-2026",
                    product_name: "Genesys AI Guide",
                    price: 49.99,
                    currency: "CAD"
                }
            });
        }

        // 触发发货事件
        function triggerOrderShipped() {
            console.log("正在发送 order_shipped 事件...");
            Genesys("command", "Journey.record", {
                eventName: "order_shipped",
                customAttributes: {
                    order_id: "ORD-998877",
                    carrier: "Canada Post",
                    tracking_number: "CA123456789"
                }
            });
        }
    </script>

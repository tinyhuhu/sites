<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>电影同声传译 AI</title>
  <style>
    body {
      margin: 0;
      background: #0e1117;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: 60px auto;
      padding: 24px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 28px;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 24px;
    }

    #subtitle {
      min-height: 160px;
      color: #ffcc00;
      font-size: 28px;
      font-weight: bold;
      line-height: 1.6;
      white-space: pre-wrap;
      margin-bottom: 24px;
    }

    button {
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 8px;
      background: #00cc66;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    button.stop {
      background: #ff4b4b;
    }

    #status {
      margin-top: 14px;
      color: #aaa;
      font-size: 14px;
      text-align: center;
    }

    #debug {
      margin-top: 18px;
      color: #777;
      font-size: 12px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎬 电影同声传译 (AI)</h1>

    <div class="card">
      <div id="subtitle">等待语音输入...</div>

      <button id="startBtn">开始实时翻译</button>

      <div id="status">状态：初始化中...</div>
      <div id="debug"></div>
    </div>
  </div>

  <script type="module">
    import Vapi from "https://esm.sh/@vapi-ai/web@2.5.2";

    const VAPI_PUBLIC_KEY = "8372d694-85f5-4957-89d5-b74bb272012f";
    const VAPI_ASSISTANT_ID = "585b5b56-9e7b-4c41-b369-693ce3256f85";
    const WSS_URL = "wss://un1qwkapg1.execute-api.us-east-2.amazonaws.com/production/";

    const subtitle = document.getElementById("subtitle");
    const statusEl = document.getElementById("status");
    const debugEl = document.getElementById("debug");
    const startBtn = document.getElementById("startBtn");

    let vapi = null;
    let ws = null;
    let isActive = false;
    let currentText = "";

    const sessionId = crypto.randomUUID();

    function log(message, data = null) {
      console.log(message, data || "");
      debugEl.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
    }

    function setStatus(text) {
      statusEl.textContent = `状态：${text}`;
    }

    function setIdle() {
      isActive = false;
      startBtn.textContent = "开始实时翻译";
      startBtn.classList.remove("stop");
      setStatus("已停止");
    }

    function setActive() {
      isActive = true;
      startBtn.textContent = "停止翻译";
      startBtn.classList.add("stop");
      setStatus("正在监听");
    }

    function connectWebSocket() {
      return new Promise((resolve, reject) => {
        const url = `${WSS_URL}?sessionId=${encodeURIComponent(sessionId)}`;

        ws = new WebSocket(url);

        ws.onopen = () => {
          log("WebSocket 已连接");

          ws.send(JSON.stringify({
            action: "register",
            sessionId: sessionId
          }));

          resolve();
        };

        ws.onerror = (err) => {
          log("WebSocket 连接失败", err);
          reject(err);
        };

        ws.onclose = () => {
          log("WebSocket 已关闭");
        };

        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            console.log("收到后端消息:", data);

            /*
              后端可以发这些格式之一：

              1. 流式增量：
              { "delta": "你好" }

              2. 完整句子：
              { "translation": "你好，欢迎..." }

              3. 最终结果：
              { "text": "你好，欢迎...", "isFinal": true }

              4. 清空字幕：
              { "type": "clear" }
            */

            if (data.type === "clear") {
              currentText = "";
              subtitle.textContent = "等待语音输入...";
              return;
            }

            if (data.delta) {
              currentText += data.delta;
              subtitle.textContent = currentText;
              return;
            }

            if (data.translation) {
              currentText = data.translation;
              subtitle.textContent = currentText;
              return;
            }

            if (data.text) {
              if (data.isFinal) {
                currentText = data.text;
              } else {
                currentText += data.text;
              }

              subtitle.textContent = currentText;
              return;
            }

          } catch (err) {
            console.error("WebSocket message parse error:", err);
          }
        };
      });
    }

    async function checkMicrophone() {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      log("麦克风权限 OK");
      stream.getTracks().forEach(track => track.stop());
    }

    function initVapi() {
      vapi = new Vapi(VAPI_PUBLIC_KEY);

      vapi.on("call-start", () => {
        log("Vapi call started");
        setActive();
      });

      vapi.on("call-end", () => {
        log("Vapi call ended");
        setIdle();
      });

      vapi.on("error", (err) => {
        console.error("Vapi error:", err);
        setStatus("Vapi 出错，请看 Console");
        setIdle();
      });

      /*
        可选：如果 Vapi 前端直接收到 transcript/message，
        也可以在这里打印出来调试。
      */
      vapi.on("message", (message) => {
        console.log("Vapi message:", message);
      });

      setStatus("Vapi 已加载");
    }

    async function startTranslation() {
      try {
        currentText = "";
        subtitle.textContent = "正在连接...";

        setStatus("连接 WebSocket 中");
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          await connectWebSocket();
        }

        setStatus("请求麦克风权限中");
        await checkMicrophone();

        setStatus("连接 Vapi 中");

        /*
          这里启动 Vapi。
          如果你的后端需要 sessionId，可以在 Vapi Assistant 的 webhook/message
          里通过 call metadata 或其他方式关联。
          最简单是后端用当前活跃 websocket connection 推送。
        */
        await vapi.start(VAPI_ASSISTANT_ID);

      } catch (err) {
        console.error("启动失败:", err);
        subtitle.textContent = "启动失败，请检查 Console";
        setStatus("启动失败");
        setIdle();
      }
    }

    function stopTranslation() {
      try {
        if (vapi) {
          vapi.stop();
        }

        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            action: "stop",
            sessionId: sessionId
          }));
        }

        setIdle();
      } catch (err) {
        console.error("停止失败:", err);
      }
    }

    startBtn.onclick = async () => {
      if (!isActive) {
        await startTranslation();
      } else {
        stopTranslation();
      }
    };

    initVapi();
  </script>
</body>
</html>
